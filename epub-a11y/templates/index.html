<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EPUB 无障碍阅读顺序校修工具</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <span class="logo">📖 EPUB 无障碍校修</span>
  <select id="bookSelect" title="选择书籍"></select>
  <button id="btnImport">导入 EPUB</button>
  <input type="file" id="fileInput" accept=".epub" hidden>
  <button id="btnSample">载入样例书</button>
  <span class="sep"></span>
  <button id="btnUndo" title="撤销最近一次修改">↩ 撤销</button>
  <span class="sep"></span>
  <button id="btnExportEpub">导出 EPUB</button>
  <button id="btnExportChanges">导出变更记录</button>
  <button id="btnExportReport">导出问题报告</button>
  <span id="toast"></span>
</header>

<main>
  <!-- 左：章节树 -->
  <section id="treePane" class="pane">
    <h2>章节树 <span class="hint">拖拽调整顺序</span></h2>
    <ul id="chapterTree" class="tree"></ul>
  </section>

  <!-- 中：排版预览 -->
  <section id="previewPane" class="pane">
    <h2>排版预览
      <span class="hint">点击定位节点</span>
      <button id="btnListSelect" class="mini" title="在预览中拖选连续段落/项目，组合为 ul/ol">▢ 框选组合列表</button>
    </h2>
    <iframe id="preview" title="章节预览"></iframe>
  </section>

  <!-- 右：标签页 -->
  <section id="sidePane" class="pane">
    <div class="tabs">
      <button class="tab active" data-tab="order">朗读顺序</button>
      <button class="tab" data-tab="issues">问题 <span id="issueCount" class="badge"></span></button>
      <button class="tab" data-tab="landmarks">地标</button>
      <button class="tab" data-tab="changes">变更</button>
    </div>
    <div id="tab-order" class="tabpage active">
      <div id="orderList" class="list"></div>
    </div>
    <div id="tab-issues" class="tabpage">
      <div id="issueList" class="list"></div>
    </div>
    <div id="tab-landmarks" class="tabpage">
      <div id="landmarkList" class="list"></div>
    </div>
    <div id="tab-changes" class="tabpage">
      <div id="changeList" class="list"></div>
    </div>
    <!-- 节点编辑器 -->
    <div id="editor">
      <h3>节点编辑 <code id="edPath"></code></h3>
      <div id="edFields"></div>
      <div class="edBtns">
        <button id="edSave">保存修改</button>
        <button id="edLocate">在预览中定位</button>
      </div>
    </div>
  </section>
</main>

<!-- 表格工作区 -->
<div id="tableModal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>表格工作区</h3>
      <code id="twPath"></code>
      <span class="sep"></span>
      <button id="twClose">✕ 关闭</button>
    </div>
    <div class="tw-toolbar">
      <label>caption <input id="twCaption" size="30" placeholder="表格标题（屏幕阅读器首先朗读）"></label>
      <button id="twInferCol" title="把首行推断为列表头（th + scope=col/colgroup）">推断列表头</button>
      <button id="twInferRow" title="把首列推断为行表头（th + scope=row/rowgroup）">推断行表头</button>
      <span class="sep"></span>
      <button id="twSave">保存表格修改</button>
    </div>
    <div class="tw-body">
      <div id="twGridWrap"></div>
      <div id="twSide"></div>
    </div>
  </div>
</div>

<!-- 列表工作区 -->
<div id="listModal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>列表工作区</h3>
      <code id="lwPath"></code>
      <span class="sep"></span>
      <button id="lwClose">✕ 关闭</button>
    </div>
    <div class="lw-toolbar">
      <span id="lwMode" class="lw-mode"></span>
      <label id="lwTypeWrap">类型
        <select id="lwType"><option value="ul">ul 无序</option><option value="ol">ol 有序</option></select>
      </label>
      <label id="lwStartWrap" class="hidden">起始序号 <input id="lwStart" type="number" min="1" style="width:64px"></label>
      <label class="lw-check"><input id="lwStrip" type="checkbox" checked> 剥离行首编号/符号</label>
      <span class="sep"></span>
      <button id="lwCreate" class="primary">组合为列表</button>
      <span id="lwGap" class="lw-gap"></span>
    </div>
    <div class="lw-body">
      <div id="lwMain">
        <div class="lw-items-head">
          <span>项目（点击选中；→ 缩进 / ← 提升层级）</span>
          <span id="lwItemTools" class="lw-itemtools"></span>
        </div>
        <div id="lwItems"></div>
        <div class="lw-boundaries">
          <div class="lw-bside" id="lwPrev"></div>
          <div class="lw-bside" id="lwNext"></div>
        </div>
      </div>
      <div id="lwSide">
        <div class="lw-sec"><b>DOM 变化（左：提交前 ｜ 右：提交后）</b>
          <div class="lw-diff"><pre id="lwBefore"></pre><pre id="lwAfter"></pre></div>
        </div>
        <div class="lw-sec"><b>模拟朗读</b><pre id="lwReading" class="lw-reading"></pre></div>
        <div class="lw-sec" id="lwIssues"></div>
        <div class="lw-sec" id="lwBlocks"></div>
      </div>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/table.js"></script>
<script src="/static/list.js"></script>
</body>
</html>
